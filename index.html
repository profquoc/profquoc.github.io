<style>
:root { --bg: #f4f6f5; --surface: #ffffff; --fg: #18201e; --muted: #56625e; --rule: #d6dcd9; --accent: #1d5f63; --on-accent: #ffffff; --warn: #8a5a00; --field: #7b8884; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111615; --surface: #171d1c; --fg: #e3e8e6; --muted: #9aa6a2; --rule: #2b3533; --accent: #6fb7b4; --on-accent: #0d1312; --warn: #e2b25a; --field: #66736f; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #111615; --surface: #171d1c; --fg: #e3e8e6; --muted: #9aa6a2; --rule: #2b3533; --accent: #6fb7b4; --on-accent: #0d1312; --warn: #e2b25a; --field: #66736f; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
  font: 1rem/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; padding: 16px; }
form { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 28px; }
h1 { font: 600 1.25rem/1.3 Georgia, serif; margin: 0 0 6px; }
p { margin: 0 0 18px; color: var(--muted); font-size: 0.92rem; }
label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
main { width: 100%; max-width: 380px; }
input { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid var(--field); border-radius: 5px; background: var(--bg); color: var(--fg); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { margin-top: 14px; width: 100%; font: inherit; font-weight: 600; font-size: 0.95rem; line-height: 1; padding: 11px; border: 0; border-radius: 5px;
  background: var(--accent); color: var(--on-accent); cursor: pointer; }
button:disabled { opacity: 0.6; cursor: progress; }
#msg { min-height: 1.4em; margin: 12px 0 0; font-size: 0.88rem; color: var(--muted); }
#msg.error { color: var(--warn); }
</style>
</head>

</form>

const STORE = "profquoc-landing";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256"},
                                            base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(pt);
}
function show(html) { document.open(); document.write(html); document.close(); }
let saved = null;
try {
  const s = JSON.parse(sessionStorage.getItem(STORE));
  if (s && s.salt === P.salt && Date.now() - s.t < 8 * 3600e3) saved = s.html;
  else if (s) sessionStorage.removeItem(STORE);
} catch (e) {}
if (saved) {
  document.documentElement.style.visibility = "hidden";
  addEventListener("DOMContentLoaded", () => show(saved));
}
document.getElementById("pw").addEventListener("input", e => e.target.removeAttribute("aria-invalid"));
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), msg = document.getElementById("msg"), pw = document.getElementById("pw");
  if (!window.crypto || !crypto.subtle) { msg.className = "error"; msg.textContent = "This browser cannot decrypt the page (needs an https page)."; return; }
  btn.disabled = true; msg.className = ""; msg.textContent = "Decrypting…";
  let html;
  try { html = await unlock(pw.value); }
  catch (err) {
    msg.className = "error"; msg.textContent = "Wrong password.";
    btn.disabled = false; pw.setAttribute("aria-invalid", "true"); pw.focus(); pw.select(); return;
  }
  try { sessionStorage.setItem(STORE, JSON.stringify({salt: P.salt, t: Date.now(), html})); } catch (err) {}
  show(html);
});
